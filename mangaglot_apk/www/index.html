    async function fetchMangaApi(url, attempts = 3) {
      let lastError;
      for (let attempt = 1; attempt <= attempts; attempt++) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 15000);
        try {
          const res = await fetch(url, {
            signal: controller.signal,
            headers: { "Accept": "application/json" }
          });
          if (!res.ok) {
            throw new Error(`MangaDex respondió con HTTP ${res.status}`);
          }
          return await res.json();
        } catch (error) {
          lastError = error;
          if (attempt < attempts) {
            await new Promise((resolve) => setTimeout(resolve, attempt * 500));
          }
        } finally {
          clearTimeout(timeoutId);
        }
      }
      throw lastError || new Error("No se pudo conectar con MangaDex");
    }

    function isCordovaApp() {
      return window.location.protocol === "file:" || Boolean(window.cordova);
    }

    // Llamado en vivo a la API Pública Oficial de MangaDex
    async function searchMangaDexApi(query = "") {
      mState.apiLoading = true;
      mState.apiError = "";
      renderPhone();
      try {
        if (isCordovaApp()) {
          const qParam = query.trim() ? `&title=${encodeURIComponent(query.trim())}` : "";
          const url = `https://api.mangadex.org/manga?limit=8&includes[]=cover_art&contentRating[]=safe&order[followedCount]=desc${qParam}`;
          const json = await fetchMangaApi(url);
          mState.apiMangas = (json.data || []).map((item) => {
            const titles = item.attributes?.title || {};
            const title = titles.es || titles.en || titles["ja-ro"] || Object.values(titles)[0] || "Manga";
            const coverRel = (item.relationships || []).find((r) => r.type === "cover_art");
            const fileName = coverRel?.attributes?.fileName;
            return {
              id: item.id,
              title,
              origLang: item.attributes?.originalLanguage || "ja",
              cover: fileName
                ? `https://uploads.mangadex.org/covers/${item.id}/${fileName}.256.jpg`
                : TOP_BANNER
            };
          });
        } else {
          const params = new URLSearchParams({ q: query.trim(), lang: mState.apiLangFilter });
          const json = await fetchMangaApi(`/api/mangadex/search?${params}`);
          mState.apiMangas = (json.results || []).map((item) => ({
            id: item.id,
            title: item.title,
            origLang: item.originalLanguage || "ja",
            cover: item.cover_url || TOP_BANNER
          }));
        }
      } catch (e) {
        mState.apiError = `No se pudo consultar MangaDex: ${e?.message || "conexión rechazada"}. Revisa Internet y vuelve a intentar.`;
      } finally {
        mState.apiLoading = false;
        renderPhone();
      }
    }

    async function loadMangaChaptersApi(mangaObj) {
      mState.apiSelectedManga = mangaObj;
      mState.apiLoading = true;
      mState.apiError = "";
      renderPhone();
      try {
        if (isCordovaApp()) {
          const url = `https://api.mangadex.org/manga/${mangaObj.id}/feed?limit=12&order[chapter]=asc&translatedLanguage[]=${mState.apiLangFilter}`;
          const json = await fetchMangaApi(url);
          mState.apiChapters = (json.data || [])
            .filter((ch) => !ch.attributes?.externalUrl && ch.attributes?.pages > 0)
            .map((ch) => ({
              id: ch.id,
              chapter: ch.attributes?.chapter || "1",
              title: ch.attributes?.title || `Capítulo ${ch.attributes?.chapter || 1}`,
              lang: ch.attributes?.translatedLanguage || mState.apiLangFilter,
              pages: ch.attributes?.pages || 0
            }));
        } else {
          const json = await fetchMangaApi(`/api/mangadex/chapters/${encodeURIComponent(mangaObj.id)}?lang=${encodeURIComponent(mState.apiLangFilter)}`);
          mState.apiChapters = (json.chapters || []).map((ch) => ({
            id: ch.id,
            chapter: ch.chapter || "1",
            title: ch.title || `Capítulo ${ch.chapter || 1}`,
            lang: ch.language || mState.apiLangFilter,
            pages: ch.pages || 0
          }));
        }
      } catch (e) {
        mState.apiError = `Error al obtener capítulos: ${e?.message || "conexión rechazada"}.`;
      } finally {
        mState.apiLoading = false;
        renderPhone();
      }
    }

    async function openChapterFromApi(chObj) {
      mState.apiLoading = true;
      renderPhone();
      try {
        if (isCordovaApp()) {
          const json = await fetchMangaApi(`https://api.mangadex.org/at-home/server/${chObj.id}`);
          const base = json.baseUrl;
          const hash = json.chapter?.hash;
          const files = json.chapter?.dataSaver || [];
          mState.apiPageUrls = files.map((f) => `${base}/data-saver/${hash}/${f}`);
        } else {
          const json = await fetchMangaApi(`/api/mangadex/pages/${encodeURIComponent(chObj.id)}`);
          mState.apiPageUrls = json.pages || [];
        }
        mState.apiCurrentPageIdx = 0;

        if (mState.apiPageUrls.length > 0) {
          MOBILE_CHAPTERS.api_live = {
            id: "api_live",
            flag: "🌐",
            name: mState.apiSelectedManga?.title?.slice(0, 12) || "API Manga",
            tts: "ja-JP",
            bg: mState.apiPageUrls[0],
            bubbles: MOBILE_CHAPTERS.ja.bubbles
          };
          mState.chap = "api_live";
          mState.bubbleId = MOBILE_CHAPTERS.ja.bubbles[0].id;
          mState.wordIndices = [0];
          mState.tab = "reader";
        }
      } catch (e) {
        mState.apiError = "No se pudieron cargar las páginas del capítulo.";
      } finally {
        mState.apiLoading = false;
        renderPhone();
      }
    }

      return WORD_DICT[surface]?.[targetCode] || WORD_DICT[surface]?.es || surface;
    }

    function translateBubble(bubbleId, targetCode) {
      return SENTENCES[bubbleId]?.[targetCode] || SENTENCES[bubbleId]?.es || "";
    }

    function speakMobile(text, ttsLang) {
      if (!("speechSynthesis" in window) || !text) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = ttsLang || "ja-JP";
      u.rate = 0.92;
      window.speechSynthesis.speak(u);
    }

    function exportMobileAnki() {
      if (mState.saved.length === 0) return;
      const lines = [
        "#separator:tab",
        "#html:true",
        "#deck:MangaGlot_Celular",
        "#columns:Front\tBack\tReading\tSentence\tSentenceTranslation",
        ...mState.saved.map((c) => `${c.surface}\t${c.meaning} (${c.lang})\t${c.reading}\t${c.sentence}\t${c.sentenceTrans}`)
      ];
      const blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/tab-separated-values;charset=utf-8;" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "MangaGlot_AnkiDroid.txt";
      a.click();
    }

    function renderPhone() {
      const root = document.getElementById("phone-root");
      const chap = MOBILE_CHAPTERS[mState.chap] || MOBILE_CHAPTERS.ja;
      const bubble = chap.bubbles.find((b) => b.id === mState.bubbleId) || chap.bubbles[0];
      const tLang = TARGET_LANGUAGES.find((l) => l.code === mState.target) || TARGET_LANGUAGES[0];

      const selWords = bubble.words.filter((_, i) => mState.wordIndices.includes(i));
      const isPhrase = selWords.length > 1;
      const surface = selWords.map((w) => w.surface).join(mState.chap === "ko" ? " " : "");
      const reading = selWords.map((w) => w.reading).join(" · ");
      const meaning = selWords.length === bubble.words.length
        ? translateBubble(bubble.id, mState.target)
        : selWords.map((w) => translateWord(w.surface, mState.target)).join(" + ");
      const fullSentenceTrans = translateBubble(bubble.id, mState.target);
      const saveKey = `${surface}_${mState.target}`;
      const alreadySaved = mState.saved.some((x) => x.key === saveKey);

      root.innerHTML = `
        <!-- Barra de estado de celular -->
        <div class="bg-slate-950 px-5 pt-2 pb-1 flex items-center justify-between text-xs text-slate-400 font-semibold">
          <span>9:41</span>
          <span class="px-2.5 py-0.5 rounded-full bg-slate-900 border border-slate-800 text-rose-400 font-bold">📱 MangaGlot App</span>
          <span>5G 100%</span>
        </div>

        <!-- Barra de navegación superior de 3 secciones: Lector | Catálogo API | Anki -->
        <div class="bg-slate-900 px-3 py-2 border-b border-slate-800 space-y-2">
          <div class="grid grid-cols-3 gap-1.5 bg-slate-950 p-1 rounded-xl border border-slate-800">
            <button data-nav="reader" class="py-1.5 rounded-lg text-xs font-extrabold ${
              mState.tab === "reader" ? "bg-indigo-600 text-white" : "text-slate-400"
            }">📖 Lector</button>
            <button data-nav="api_catalog" class="py-1.5 rounded-lg text-xs font-extrabold ${
              mState.tab === "api_catalog" ? "bg-rose-600 text-white" : "text-slate-400"
            }">🌐 Catálogo API</button>
            <button data-nav="anki" class="py-1.5 rounded-lg text-xs font-extrabold ${
              mState.tab === "anki" ? "bg-amber-500 text-slate-950" : "text-slate-400"
            }">⭐ Anki (${mState.saved.length})</button>
          </div>

          <!-- Barra horizontal deslizable para elegir idioma de traducción -->
          <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5">
            <span class="text-xs font-bold text-indigo-400 shrink-0">🌍 A:</span>
            ${TARGET_LANGUAGES.map((l) => `
              <button data-tlang="${l.code}" class="px-2.5 py-1 rounded-xl text-xs font-bold shrink-0 transition ${
                mState.target === l.code ? "bg-rose-600 text-white shadow" : "bg-slate-800 text-slate-300"
              }">${l.flag} ${l.name}</button>
            `).join("")}
          </div>
        </div>

        ${
          mState.tab === "reader"
            ? `
        <!-- Selector rápido de idioma de manga + Selección táctil de frase -->
        <div class="px-3 pt-2 flex flex-wrap items-center justify-between gap-1.5">
          <div class="flex items-center gap-1">
            ${Object.values(MOBILE_CHAPTERS).map((c) => `
              <button data-chap="${c.id}" class="px-2.5 py-1 rounded-xl text-xs font-bold border ${
                mState.chap === c.id ? "bg-indigo-600 border-indigo-400 text-white" : "bg-slate-800 border-slate-700 text-slate-300"
              }">${c.flag} ${c.name}</button>
            `).join("")}
          </div>

          <div class="flex items-center gap-1">
            <button id="m-multi" class="py-1 px-2.5 rounded-xl text-xs font-extrabold border ${
              mState.multi ? "bg-fuchsia-600 border-fuchsia-300 text-white" : "bg-slate-900 border-slate-700 text-slate-200"
            }">
              👆 ${mState.multi ? "Uniendo: ON" : "Unir Palabras"}
            </button>
            <button id="m-mode" class="py-1 px-2.5 rounded-xl text-xs font-extrabold bg-emerald-600 text-white">
              ${mState.mode === "original" ? "🔄 Traducir" : "🈶 Original"}
            </button>
          </div>
        </div>

        ${
          mState.chap === "api_live" && mState.apiPageUrls.length > 1
            ? `<div class="px-3 pt-1.5 flex items-center justify-between text-xs">
                <button id="prev-api-page" class="px-2.5 py-1 rounded-lg bg-slate-800 font-bold">◀ Pág. Anterior</button>
                <span class="font-bold text-indigo-300">Página ${mState.apiCurrentPageIdx + 1} / ${mState.apiPageUrls.length}</span>
                <button id="next-api-page" class="px-2.5 py-1 rounded-lg bg-slate-800 font-bold">Pág. Siguiente ▶</button>
              </div>`
            : ""
        }

        <!-- Borde Anime Superior + Lienzo de Manga + Borde Anime Inferior -->
        <div class="px-2.5 pt-2 pb-1 space-y-1.5">
          <img src="${TOP_BANNER}" alt="Borde Anime Superior" class="w-full rounded-xl" />

          <div class="p-1.5 rounded-2xl bg-gradient-to-b from-rose-500 via-indigo-500 to-amber-500">
            <div class="relative w-full rounded-xl overflow-hidden bg-slate-900">
              <img src="${chap.bg}" alt="Página Manga" class="w-full h-auto block min-h-[380px] object-cover" />

              ${chap.bubbles.map((b, bIdx) => {
                const active = b.id === bubble.id;
                const bTrans = translateBubble(b.id, mState.target);
                return `
                  <div
                    style="top:${b.top}; left:${b.left}; width:${b.width};"
                    class="absolute rounded-2xl p-2 bg-white/96 text-slate-900 shadow-xl ${
                      active ? "ring-4 ring-rose-500 z-20" : "z-10"
                    }"
                  >
                    <div class="flex items-center justify-between mb-1 pb-0.5 border-b border-slate-200">
                      <button data-all="${b.id}" class="text-xs font-extrabold px-1.5 py-0.5 rounded bg-slate-900 text-white">
                        Frase #${bIdx + 1} (Todo)
                      </button>
                      <button data-tts="${b.id}" class="text-xs font-bold px-1.5 py-0.5 rounded bg-indigo-100 text-indigo-900">
                        🔊
                      </button>
                    </div>

                    ${
                      mState.mode === "translated"
                        ? `<div data-all="${b.id}" class="py-1 text-center font-extrabold text-xs text-slate-900">${bTrans}</div>`
                        : `<div class="flex flex-wrap items-center justify-center gap-1">
                            ${b.words.map((w, wIdx) => {
                              const isSel = active && mState.wordIndices.includes(wIdx);
                              return `
                                <button
                                  data-wb="${b.id}"
                                  data-wi="${wIdx}"
                                  class="word-chip px-1.5 py-0.5 rounded-lg border flex flex-col items-center ${
                                    isSel ? "bg-rose-600 text-white border-rose-700 scale-105 shadow" : "bg-slate-100 text-slate-900 border-slate-300"
                                  }"
                                >
                                  <span class="text-xs leading-none ${isSel ? "text-rose-100" : "text-slate-500"}">${w.reading}</span>
                                  <span class="text-xs font-black">${w.surface}</span>
                                </button>
                              `;
                            }).join("")}
                          </div>`
                    }
                  </div>
                `;
              }).join("")}
            </div>
          </div>

          <img src="${BOTTOM_BANNER}" alt="Borde Anime Inferior" class="w-full rounded-xl" />
        </div>`
            : mState.tab === "api_catalog"
            ? `
        <!-- PESTAÑA CATÁLOGO API EN VIVO (MANGADEX API) -->
        <div class="p-3.5 space-y-3 min-h-[430px] max-h-[470px] overflow-y-auto">
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 space-y-2">
            <div class="text-xs font-extrabold text-rose-400">🌐 Buscador de Manga en Vivo (MangaDex API)</div>
            <div class="flex gap-1.5">
              <input
                id="api-q"
                type="text"
                placeholder="Ej. One Piece, Naruto, Solo Leveling..."
                value="${mState.apiSearchQuery}"
                class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white"
              />
              <button id="btn-api-search" class="px-3 py-2 rounded-xl bg-rose-600 text-white font-black text-xs">
                Buscar
              </button>
            </div>
            <div class="flex items-center gap-1.5 text-xs">
              <span class="text-slate-400 font-semibold">Idioma capítulos:</span>
              ${[
                { c: "en", l: "🇺🇸 EN" },
                { c: "es", l: "🇪🇸 ES" },
                { c: "ja", l: "🇯🇵 JA" },
                { c: "fr", l: "🇫🇷 FR" },
                { c: "pt-br", l: "🇧🇷 PT" }
              ].map((x) => `
                <button data-apilang="${x.c}" class="px-2 py-0.5 rounded-lg font-bold ${
                  mState.apiLangFilter === x.c ? "bg-indigo-600 text-white" : "bg-slate-800 text-slate-300"
                }">${x.l}</button>
              `).join("")}
            </div>
          </div>

          ${
            mState.apiLoading
              ? `<div class="text-center py-8 text-xs font-bold text-indigo-300">Cargando desde MangaDex API...</div>`
              : mState.apiError
              ? `<div class="p-3 rounded-xl bg-amber-500/15 border border-amber-500/40 text-xs text-amber-200">${mState.apiError}</div>`
              : ""
          }

          ${
            mState.apiSelectedManga && mState.apiChapters.length > 0
              ? `
              <div class="space-y-2">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-extrabold text-emerald-400">Capítulos de ${mState.apiSelectedManga.title}:</span>
                  <button id="btn-back-mangas" class="text-xs text-slate-400 underline">← Volver</button>
                </div>
                ${mState.apiChapters.map((ch) => `
                  <button data-open-ch="${ch.id}" class="w-full text-left bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-xl p-2.5 flex items-center justify-between">
                    <div>
                      <div class="text-xs font-extrabold text-white">Cap. ${ch.chapter} — ${ch.title}</div>
                      <div class="text-xs text-slate-400">Idioma: ${ch.lang.toUpperCase()} • ${ch.pages} págs.</div>
                    </div>
                    <span class="px-2.5 py-1 rounded-lg bg-indigo-600 text-white text-xs font-bold">Leer ▶</span>
                  </button>
                `).join("")}
              </div>`
              : `
              <div class="grid grid-cols-2 gap-2.5">
                ${mState.apiMangas.map((m) => `
                  <button data-pick-manga="${m.id}" class="bg-slate-900 border border-slate-800 rounded-xl p-2 text-left flex flex-col justify-between hover:border-rose-500 transition">
                    <img src="${m.cover}" alt="${m.title}" class="w-full h-32 object-cover rounded-lg mb-1.5 bg-slate-950" />
                    <div class="text-xs font-extrabold text-white line-clamp-2">${m.title}</div>
                    <span class="text-xs text-rose-400 font-bold mt-1">Ver capítulos →</span>
                  </button>
                `).join("")}
              </div>`
          }
        </div>`
            : `
        <!-- Pestaña AnkiDroid en el Celular -->
        <div class="p-3.5 space-y-3 min-h-[420px]">
          <button id="m-export-anki" ${mState.saved.length === 0 ? "disabled" : ""} class="w-full py-3 rounded-xl bg-amber-500 disabled:opacity-40 text-slate-950 font-black text-xs shadow">
            📥 Descargar Mazo para AnkiDroid (${mState.saved.length} tarjetas)
          </button>
          ${
            mState.saved.length === 0
              ? `<div class="text-center py-12 text-xs text-slate-400">
                  Toca una palabra o une varias palabras en el Lector y pulsa <b>"Guardar en Anki"</b>.
                </div>`
              : mState.saved.map((c, idx) => `
                  <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 space-y-1">
                    <div class="flex justify-between items-center">
                      <span class="text-xs font-bold text-indigo-400">${c.type} → ${c.lang}</span>
                      <button data-del="${idx}" class="text-xs text-rose-400 font-bold">✕</button>
                    </div>
                    <div class="text-xs text-rose-400">${c.reading}</div>
                    <div class="text-base font-black">${c.surface}</div>
                    <div class="text-sm font-extrabold text-emerald-400">${c.meaning}</div>
                    <div class="text-xs text-slate-400 pt-1 border-t border-slate-800">${c.sentence}</div>
                  </div>
                `).join("")
          }
        </div>`
        }

        <!-- PANEL INFERIOR DEL CELULAR -->
        <div class="bg-slate-900 border-t-2 border-rose-500 p-3.5 space-y-2">
          <div class="flex items-center justify-between gap-2">
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-1.5">
                <span class="text-xs px-1.5 py-0.5 rounded bg-rose-500/20 text-rose-300 font-bold">
                  ${isPhrase ? `Frase (${selWords.length} palabras)` : "Palabra"}
                </span>
                <span class="text-xs text-rose-400 font-bold truncate">${reading}</span>
              </div>
              <div class="text-lg font-black text-white truncate mt-0.5">${surface}</div>
            </div>
            <button id="m-speak-sel" class="px-3 py-2 rounded-xl bg-indigo-600 text-white font-bold text-xs shrink-0">
              🔊 Pronunciar
            </button>
          </div>

          <div class="bg-slate-950 border border-slate-800 rounded-xl p-2.5">
            <div class="text-xs font-bold text-emerald-400">
              ${tLang.flag} ${tLang.name}: <span class="text-sm font-black text-white ml-1">${meaning}</span>
            </div>
            <div class="text-xs text-amber-300 mt-0.5 truncate">
              Globo: “${fullSentenceTrans}”
            </div>
          </div>

          <div class="flex items-center gap-2 pt-0.5">
            <button id="m-save" class="flex-1 py-2.5 px-3 rounded-xl font-black text-xs ${
              alreadySaved ? "bg-amber-500 text-slate-950" : "bg-rose-600 text-white"
            }">
              ${alreadySaved ? "★ Guardada en Anki" : `☆ Guardar ${isPhrase ? "Frase" : "Palabra"} en Anki`}
            </button>
          </div>
        </div>
      `;

      // Eventos
      document.querySelectorAll("[data-nav]").forEach((b) => {
        b.onclick = () => {
          mState.tab = b.getAttribute("data-nav");
          if (mState.tab === "api_catalog" && mState.apiMangas.length === 0) {
            searchMangaDexApi("");
          } else {
            renderPhone();
          }
        };
      });

      document.querySelectorAll("[data-chap]").forEach((b) => {
        b.onclick = () => {
          mState.chap = b.getAttribute("data-chap");
          mState.bubbleId = MOBILE_CHAPTERS[mState.chap].bubbles[0].id;
          mState.wordIndices = [0];
          renderPhone();
        };
      });

      document.querySelectorAll("[data-tlang]").forEach((b) => {
        b.onclick = () => {
          mState.target = b.getAttribute("data-tlang");
          renderPhone();
        };
      });

      const multiBtn = document.getElementById("m-multi");
      if (multiBtn) multiBtn.onclick = () => { mState.multi = !mState.multi; renderPhone(); };

      const modeBtn = document.getElementById("m-mode");
      if (modeBtn) modeBtn.onclick = () => { mState.mode = mState.mode === "original" ? "translated" : "original"; renderPhone(); };

      document.querySelectorAll("[data-wb]").forEach((b) => {
        b.onclick = (e) => {
          e.stopPropagation();
          const bId = b.getAttribute("data-wb");
          const wIdx = parseInt(b.getAttribute("data-wi"), 10);
          if (mState.bubbleId !== bId) {
            mState.bubbleId = bId;
            mState.wordIndices = [wIdx];
          } else if (mState.multi) {
            const exists = mState.wordIndices.includes(wIdx);
            const next = exists ? mState.wordIndices.filter((x) => x !== wIdx) : [...mState.wordIndices, wIdx].sort((a, c) => a - c);
            mState.wordIndices = next.length ? next : [wIdx];
          } else {
            mState.wordIndices = [wIdx];
          }
          renderPhone();
        };
      });

      document.querySelectorAll("[data-all]").forEach((b) => {
        b.onclick = () => {
          const bId = b.getAttribute("data-all");
          const targetB = chap.bubbles.find((x) => x.id === bId);
          if (targetB) {
            mState.bubbleId = bId;
            mState.wordIndices = targetB.words.map((_, i) => i);
            renderPhone();
          }
        };
      });

      document.querySelectorAll("[data-tts]").forEach((b) => {
        b.onclick = () => {
          const bId = b.getAttribute("data-tts");
          const targetB = chap.bubbles.find((x) => x.id === bId);
          if (targetB) speakMobile(targetB.original_text, chap.tts);
        };
      });

      document.getElementById("m-speak-sel").onclick = () => speakMobile(surface, chap.tts);

      document.getElementById("m-save").onclick = () => {
        if (alreadySaved) {
          mState.saved = mState.saved.filter((x) => x.key !== saveKey);
        } else {
          mState.saved.unshift({
            key: saveKey,
            type: isPhrase ? `Frase (${selWords.length} palabras)` : "Palabra",
            surface,
            reading,
            meaning,
            lang: `${tLang.flag} ${tLang.name}`,
            sentence: bubble.original_text,
            sentenceTrans: fullSentenceTrans
          });
        }
        renderPhone();
      };

      const expBtn = document.getElementById("m-export-anki");
      if (expBtn) expBtn.onclick = exportMobileAnki;

      document.querySelectorAll("[data-del]").forEach((b) => {
        b.onclick = () => {
          mState.saved.splice(parseInt(b.getAttribute("data-del"), 10), 1);
          renderPhone();
        };
      });

      // Eventos del Catálogo API
      const qInput = document.getElementById("api-q");
      if (qInput) {
        qInput.oninput = (e) => { mState.apiSearchQuery = e.target.value; };
      }
      const searchBtn = document.getElementById("btn-api-search");
      if (searchBtn) {
        searchBtn.onclick = () => searchMangaDexApi(mState.apiSearchQuery);
      }
      document.querySelectorAll("[data-apilang]").forEach((b) => {
        b.onclick = () => {
          mState.apiLangFilter = b.getAttribute("data-apilang");
          if (mState.apiSelectedManga) loadMangaChaptersApi(mState.apiSelectedManga);
          else renderPhone();
        };
      });
      document.querySelectorAll("[data-pick-manga]").forEach((b) => {
        b.onclick = () => {
          const id = b.getAttribute("data-pick-manga");
          const m = mState.apiMangas.find((x) => x.id === id);
          if (m) loadMangaChaptersApi(m);
        };
      });
      const backBtn = document.getElementById("btn-back-mangas");
      if (backBtn) {
        backBtn.onclick = () => {
          mState.apiSelectedManga = null;
          mState.apiChapters = [];
          renderPhone();
        };
      }
      document.querySelectorAll("[data-open-ch]").forEach((b) => {
        b.onclick = () => {
          const id = b.getAttribute("data-open-ch");
          const ch = mState.apiChapters.find((x) => x.id === id);
          if (ch) openChapterFromApi(ch);
        };
      });
      const prevPage = document.getElementById("prev-api-page");
      if (prevPage) {
        prevPage.onclick = () => {
          if (mState.apiCurrentPageIdx > 0) {
            mState.apiCurrentPageIdx--;
            MOBILE_CHAPTERS.api_live.bg = mState.apiPageUrls[mState.apiCurrentPageIdx];
            renderPhone();
          }
        };
      }
      const nextPage = document.getElementById("next-api-page");
      if (nextPage) {
        nextPage.onclick = () => {
          if (mState.apiCurrentPageIdx < mState.apiPageUrls.length - 1) {
            mState.apiCurrentPageIdx++;
            MOBILE_CHAPTERS.api_live.bg = mState.apiPageUrls[mState.apiCurrentPageIdx];
            renderPhone();
          }
        };
      }
    }

    renderPhone();
  </script>
</body>
</html>
