<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MangaGlot — Aprende Idiomas Leyendo Manga + Anki</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@500;700;900&family=Noto+Sans+KR:wght@500;700&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Noto Sans JP', 'Noto Sans KR', 'Noto Sans SC', sans-serif;
      background-color: #070a12;
      color: #f1f5f9;
      overflow-x: hidden;
    }
    .manga-bubble {
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease;
      touch-action: none;
    }
    .manga-bubble:hover {
      z-index: 30;
    }
    .word-chip {
      transition: all 0.14s ease;
      user-select: none;
      -webkit-user-select: none;
    }
    .bottom-sheet-enter {
      animation: slideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .anime-border-glow {
      box-shadow: 0 0 35px rgba(244, 63, 94, 0.22), 0 0 60px rgba(99, 102, 241, 0.18);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ============================================================================

    const TARGET_LANGUAGES = [

    // ============================================================================

          <circle cx="170" cy="257" r="22" fill="${t.accent}"/>

        <!-- VIÑETA 4 -->
        <g transform="translate(28, 742)">

          <text x="26" y="328" fill="#94a3b8" font-size="16" font-weight="700">${t.title}</text>
        </g>
      </svg>`;

      return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;

    const ANIME_BORDERS = {
      leftTop: createAnimeBorderCharacterSvg("leftTop"),
      leftBottom: createAnimeBorderCharacterSvg("leftBottom"),
      rightTop: createAnimeBorderCharacterSvg("rightTop"),

    // ============================================================================
    const DEMO_CHAPTERS = {

    // ============================================================================
    // Servicio de Traducción Dinámica al Idioma que el Usuario Elija
    // ============================================================================
    const translationCache = {};

    async function translateTextToTargetLang(text, sourceLang, targetLang, contextSentence = "", apiKey = "") {
      if (!text) return "";
      const cleanSrc = (sourceLang || "ja").split("-")[0];
      const cleanTgt = (targetLang || "es").split("-")[0];
      if (cleanSrc === cleanTgt) return text;

      const cacheKey = `${cleanSrc}_${cleanTgt}_${text}`;
      if (translationCache[cacheKey]) return translationCache[cacheKey];

      // 1. Si el usuario ingresó Gemini API Key, usamos Gemini para traducción contextual precisa
      if (apiKey && apiKey.trim()) {
        try {
          const res = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey.trim())}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [{
                  parts: [{
                    text: `Traduce únicamente este texto "${text}" (en contexto de la frase "${contextSentence}") del idioma '${sourceLang}' al idioma '${targetLang}'. Devuelve SOLO la traducción directa sin comillas ni explicaciones extra.`
                  }]
                }],
                generationConfig: { temperature: 0.1 }
              })
            }
          );
          if (res.ok) {
            const data = await res.json();
            const out = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
            if (out) {
              translationCache[cacheKey] = out;
              return out;
            }
          }
        } catch (e) {
          // Continúa al traductor gratuito instantáneo
        }
      }

      // 2. Traductor multilingüe instantáneo sin necesidad de API Key
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${encodeURIComponent(sourceLang || "auto")}&tl=${encodeURIComponent(targetLang)}&dt=t&q=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        if (res.ok) {
          const data = await res.json();
          const translated = (data[0] || []).map((seg) => seg[0]).join("");
          if (translated) {
            translationCache[cacheKey] = translated;
            return translated;
          }
        }
      } catch (e) {
        // Fallback secundario MyMemory
        try {
          const mmUrl = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${cleanSrc}|${cleanTgt}`;
          const mmRes = await fetch(mmUrl);
          if (mmRes.ok) {
            const mmData = await mmRes.json();
            const mmText = mmData?.responseData?.translatedText;
            if (mmText) {
              translationCache[cacheKey] = mmText;
              return mmText;
            }
          }
        } catch (_) {}
      }

      return text;
    }

    // ============================================================================
    // Componente Principal
    // ============================================================================
    function App() {
      const [activeChapterKey, setActiveChapterKey] = useState("ja");
      const [customChapters, setCustomChapters] = useState({});
      const [displayMode, setDisplayMode] = useState("original"); // "original" | "translated" | "bilingual"
      const [showFurigana, setShowFurigana] = useState(true);
      const [showAnimeBorders, setShowAnimeBorders] = useState(true);

      // Idioma al que el usuario quiere traducir palabras y frases seleccionadas
      const [targetLang, setTargetLang] = useState("es");

      // Selección de globo y selección táctil (1 palabra o varias palabras arrastrando / tocando)
      const [selectedBubble, setSelectedBubble] = useState(DEMO_CHAPTERS.ja.bubbles[0]);
      const [selectedWordIndices, setSelectedWordIndices] = useState([0]);
      const [multiSelectMode, setMultiSelectMode] = useState(false);
      const [isDraggingWords, setIsDraggingWords] = useState(false);
      const dragStartRef = useRef(null);

      // Traducción dinámica al idioma elegido por el usuario
      const [dynamicWordTranslation, setDynamicWordTranslation] = useState("");
      const [dynamicBubbleTranslation, setDynamicBubbleTranslation] = useState("");
      const [bubbleTranslationsMap, setBubbleTranslationsMap] = useState({});
      const [isTranslating, setIsTranslating] = useState(false);

      const [isBottomSheetOpen, setIsBottomSheetOpen] = useState(true);
      const [savedItems, setSavedItems] = useState([]);
      const [activeTab, setActiveTab] = useState("reader"); // "reader" | "vocab" | "import"

      // Estados para importar/analizar
      const [scrapeUrl, setScrapeUrl] = useState("");
      const [apiKey, setApiKey] = useState("");
      const [sourceLang, setSourceLang] = useState("ja");
      const [isLoading, setIsLoading] = useState(false);
      const [statusMsg, setStatusMsg] = useState("");

      const allChapters = { ...DEMO_CHAPTERS, ...customChapters };
      const currentChapter = allChapters[activeChapterKey] || DEMO_CHAPTERS.ja;

      const targetLangInfo = TARGET_LANGUAGES.find((l) => l.code === targetLang) || TARGET_LANGUAGES[0];

      // Palabras actualmente seleccionadas (puede ser 1 palabra o una frase de varias palabras)
      const selectedWordsList = (selectedBubble?.words || []).filter((_, idx) =>
        selectedWordIndices.includes(idx)
      );
      const isPhraseSelected = selectedWordsList.length > 1;
      const singleSelectedWord = selectedWordsList.length === 1 ? selectedWordsList[0] : null;

      // Une el texto de las palabras seleccionadas (con espacio para idiomas occidentales, sin espacio para JA/ZH)
      const joinWordsSurface = (wordsArr, langCode) => {
        if (!wordsArr || wordsArr.length === 0) return "";
        const needsSpace = ["en", "es", "fr", "pt", "de", "it", "ru", "ko"].includes((langCode || "").split("-")[0]);
        return wordsArr.map((w) => w.surface).join(needsSpace ? " " : "");
      };

      const selectedSurfaceText = joinWordsSurface(selectedWordsList, currentChapter.source_language);
      const selectedReadingText = selectedWordsList.map((w) => w.reading.split(" ")[0]).join(" · ");

      // Actualizar traducción cuando cambia la palabra/frase seleccionada o cuando el usuario cambia el idioma destino
      useEffect(() => {
        let cancelled = false;
        async function updateTranslations() {
          if (!selectedBubble || selectedWordsList.length === 0) return;

          // Si es 1 sola palabra y el idioma destino es español (por defecto en demos), usamos su significado + traducción
          if (!isPhraseSelected && targetLang === "es" && singleSelectedWord?.meaning) {
            setDynamicWordTranslation(singleSelectedWord.meaning);
            setDynamicBubbleTranslation(selectedBubble.translated_text);
            return;
          }

          setIsTranslating(true);
          const [wordTrans, sentenceTrans] = await Promise.all([
            translateTextToTargetLang(
              selectedSurfaceText,
              currentChapter.source_language,
              targetLang,
              selectedBubble.original_text,
              apiKey
            ),
            targetLang === "es"
              ? Promise.resolve(selectedBubble.translated_text)
              : translateTextToTargetLang(
                  selectedBubble.original_text,
                  currentChapter.source_language,
                  targetLang,
                  selectedBubble.original_text,
                  apiKey
                )
          ]);

          if (!cancelled) {
            setDynamicWordTranslation(wordTrans);
            setDynamicBubbleTranslation(sentenceTrans);
            setIsTranslating(false);
          }
        }
        updateTranslations();
        return () => {
          cancelled = true;
        };
      }, [selectedBubble, selectedWordIndices, targetLang, activeChapterKey]);

      // Traducir todos los globos de la página cuando se cambia de idioma destino
      useEffect(() => {
        let cancelled = false;
        async function translateAllBubbles() {
          const bubbles = currentChapter.bubbles || [];
          if (targetLang === "es") {
            const mapEs = {};
            bubbles.forEach((b) => {
              mapEs[b.id] = b.translated_text;
            });
            setBubbleTranslationsMap(mapEs);
            return;
          }
          const newMap = {};
          for (const b of bubbles) {
            const t = await translateTextToTargetLang(
              b.original_text,
              currentChapter.source_language,
              targetLang,
              b.original_text,
              apiKey
            );
            newMap[b.id] = t;
          }
          if (!cancelled) setBubbleTranslationsMap(newMap);
        }
        translateAllBubbles();
        return () => {
          cancelled = true;
        };
      }, [targetLang, activeChapterKey, customChapters]);

      useEffect(() => {
        const stopDrag = () => setIsDraggingWords(false);
        window.addEventListener("pointerup", stopDrag);
        return () => window.removeEventListener("pointerup", stopDrag);
      }, []);

      const handleSelectChapter = (key) => {
        setActiveChapterKey(key);
        const chap = allChapters[key];
        if (chap && chap.bubbles && chap.bubbles.length > 0) {
          setSelectedBubble(chap.bubbles[0]);
          setSelectedWordIndices([0]);
        } else {
          setSelectedBubble(null);
          setSelectedWordIndices([]);
        }
        setActiveTab("reader");
      };

      // Tocar o arrastrar con el táctil/mouse sobre palabras para seleccionar 1 o varias palabras
      const handleWordPointerDown = (bubble, wIdx, e) => {
        e.stopPropagation();
        setIsBottomSheetOpen(true);

        if (selectedBubble?.id !== bubble.id) {
          setSelectedBubble(bubble);
          setSelectedWordIndices([wIdx]);
          dragStartRef.current = { bubbleId: bubble.id, startIdx: wIdx };
          setIsDraggingWords(true);
          return;
        }

        if (multiSelectMode || e.shiftKey) {
          // Modo selección de frase: agrega o quita palabras tocadas con el dedo
          setSelectedWordIndices((prev) => {
            const exists = prev.includes(wIdx);
            const next = exists ? prev.filter((i) => i !== wIdx) : [...prev, wIdx].sort((a, b) => a - b);
            return next.length > 0 ? next : [wIdx];
          });
        } else {
          setSelectedWordIndices([wIdx]);
          dragStartRef.current = { bubbleId: bubble.id, startIdx: wIdx };
          setIsDraggingWords(true);
        }
      };

      const handleWordPointerEnter = (bubble, wIdx) => {
        if (!isDraggingWords || !dragStartRef.current) return;
        if (dragStartRef.current.bubbleId !== bubble.id) return;
        const start = Math.min(dragStartRef.current.startIdx, wIdx);
        const end = Math.max(dragStartRef.current.startIdx, wIdx);
        const range = [];
        for (let i = start; i <= end; i++) range.push(i);
        setSelectedWordIndices(range);
      };

      // Soporte para deslizar el dedo en pantallas táctiles móviles sobre varias palabras
      const handleBubbleTouchMove = (bubble, e) => {
        const touch = e.touches?.[0];
        if (!touch) return;
        const el = document.elementFromPoint(touch.clientX, touch.clientY);
        if (!el) return;
        const wordBtn = el.closest("[data-word-index]");
        if (!wordBtn) return;
        const bId = wordBtn.getAttribute("data-bubble-id");
        const wIdx = parseInt(wordBtn.getAttribute("data-word-index"), 10);
        if (bId === bubble.id && !Number.isNaN(wIdx)) {
          if (!dragStartRef.current || dragStartRef.current.bubbleId !== bubble.id) {
            dragStartRef.current = { bubbleId: bubble.id, startIdx: wIdx };
          }
          const start = Math.min(dragStartRef.current.startIdx, wIdx);
          const end = Math.max(dragStartRef.current.startIdx, wIdx);
          const range = [];
          for (let i = start; i <= end; i++) range.push(i);
          setSelectedBubble(bubble);
          setSelectedWordIndices(range);
          setIsBottomSheetOpen(true);
        }
      };

      const selectFullBubblePhrase = (bubble) => {
        if (!bubble?.words) return;
        setSelectedBubble(bubble);
        setSelectedWordIndices(bubble.words.map((_, i) => i));
        setIsBottomSheetOpen(true);
      };

      const speakText = (text, langCode = "ja-JP") => {
        if (!("speechSynthesis" in window) || !text) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        const langMap = { ja: "ja-JP", ko: "ko-KR", zh: "zh-CN", en: "en-US", fr: "fr-FR", es: "es-ES" };
        utterance.lang = langMap[langCode] || langCode || "ja-JP";
        utterance.rate = 0.92;
        window.speechSynthesis.speak(utterance);
      };

      // Guardar palabra individual o frase de varias palabras en Mi Vocabulario / Anki
      const handleSaveCurrentSelection = () => {
        if (!selectedBubble || selectedWordsList.length === 0) return;
        const itemKey = `${selectedSurfaceText}__${targetLang}`;
        const exists = savedItems.some((item) => item.key === itemKey);

        if (exists) {
          setSavedItems(savedItems.filter((item) => item.key !== itemKey));
        } else {
          const newEntry = {
            key: itemKey,
            type: isPhraseSelected ? "Frase seleccionada" : (singleSelectedWord?.pos || "Palabra"),
            surface: selectedSurfaceText,
            reading: selectedReadingText,
            base_form: isPhraseSelected
              ? selectedWordsList.map((w) => w.base_form).join(" + ")
              : (singleSelectedWord?.base_form || selectedSurfaceText),
            meaning: dynamicWordTranslation || singleSelectedWord?.meaning || "",
            targetLangName: `${targetLangInfo.flag} ${targetLangInfo.name}`,
            targetLangCode: targetLang,
            sourceLangCode: currentChapter.source_language || "ja",
            grammar_note: isPhraseSelected
              ? selectedWordsList.map((w) => `${w.surface} (${w.meaning})`).join(" · ")
              : (singleSelectedWord?.grammar_note || ""),
            sentence: selectedBubble.original_text,
            sentenceTranslation: dynamicBubbleTranslation || selectedBubble.translated_text,
            chapterTitle: currentChapter.title
          };
          setSavedItems([newEntry, ...savedItems]);
        }
      };

      const isCurrentSelectionSaved = () => {
        if (!selectedSurfaceText) return false;
        const itemKey = `${selectedSurfaceText}__${targetLang}`;
        return savedItems.some((item) => item.key === itemKey);
      };

      // ========================================================================
      // Exportación directa a Anki (.txt / .tsv compatible con Anki Desktop y AnkiDroid)
      // ========================================================================
      const exportToAnkiFile = () => {
        if (savedItems.length === 0) return;
        const headers = [
          "#separator:tab",
          "#html:true",
          "#deck:MangaGlot_Idiomas",
          "#columns:Front\tBack\tReading\tContextSentence\tContextTranslation\tTags"
        ];

        const cleanTab = (str) => String(str || "").replace(/\t|\r|\n/g, " ").trim();

        const rows = savedItems.map((item) => {
          const front = `<div style="font-size:28px;font-weight:bold;">${cleanTab(item.surface)}</div>`;
          const back = `<div><b>${cleanTab(item.meaning)}</b> <small>(${cleanTab(item.targetLangName)})</small><br/><i>${cleanTab(item.type)} — Base: ${cleanTab(item.base_form)}</i><br/><small>${cleanTab(item.grammar_note)}</small></div>`;
          const reading = cleanTab(item.reading);
          const contextSentence = cleanTab(item.sentence);
          const contextTranslation = cleanTab(item.sentenceTranslation);
          const tags = `MangaGlot idioma_${cleanTab(item.sourceLangCode)} a_${cleanTab(item.targetLangCode)}`;
          return [front, back, reading, contextSentence, contextTranslation, tags].join("\t");
        });

        const fileContent = [...headers, ...rows].join("\n");
        const blob = new Blob(["\uFEFF" + fileContent], { type: "text/tab-separated-values;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `MangaGlot_Anki_${new Date().toISOString().slice(0, 10)}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const exportToCsvFile = () => {
        if (savedItems.length === 0) return;
        const escapeCsv = (val) => `"${String(val || "").replace(/"/g, '""')}"`;
        const header = ["Palabra_o_Frase", "Lectura", "Traduccion", "Idioma_Destino", "Tipo", "Nota_Desglose", "Oracion_Manga", "Traduccion_Oracion"].join(",");
        const lines = savedItems.map((item) =>
          [
            escapeCsv(item.surface),
            escapeCsv(item.reading),
            escapeCsv(item.meaning),
            escapeCsv(item.targetLangName),
            escapeCsv(item.type),
            escapeCsv(item.grammar_note),
            escapeCsv(item.sentence),
            escapeCsv(item.sentenceTranslation)
          ].join(",")
        );
        const csvContent = [header, ...lines].join("\n");
        const blob = new Blob(["\uFEFF" + csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `MangaGlot_Vocabulario_${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      // Analizar imagen subida con Gemini
      const analyzeDirectWithGemini = async (file, key, srcLang, tgtLang) => {
        const base64Data = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result.split(",")[1]);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
        const localUrl = URL.createObjectURL(file);
        const prompt = `Analiza esta página de manga/manhwa/cómic. Detecta todos los globos de diálogo. Devuelve un JSON con este formato exacto:
{
  "source_language": "${srcLang === 'auto' ? 'ja' : srcLang}",
  "target_language": "${tgtLang}",
  "bubbles": [
    {
      "id": "b1",
      "box": { "x": 0.1, "y": 0.1, "w": 0.3, "h": 0.2 },
      "original_text": "...",
      "reading_full": "...",
      "translated_text": "...",
      "words": [
        { "surface": "...", "reading": "...", "base_form": "...", "pos": "...", "meaning": "...", "grammar_note": "..." }
      ]
    }
  ]
}`;
        const res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(key)}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { inline_data: { mime_type: file.type || "image/jpeg", data: base64Data } },
                  { text: prompt }
                ]
              }],
              generationConfig: { responseMimeType: "application/json", temperature: 0.1 }
            })
          }
        );
        const json = await res.json();
        if (!res.ok) throw new Error(json.error?.message || "Error en Gemini API");
        const parsed = JSON.parse(json.candidates[0].content.parts[0].text);
        return { image_url: localUrl, analysis: parsed };
      };

      const handleUploadImage = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setIsLoading(true);
        setStatusMsg("Analizando página con el motor híbrido (OCR + Gemini)...");

        try {
          let data;
          if (window.location.protocol === "file:") {
            if (!apiKey.trim()) {
              throw new Error("Ingresa tu Gemini API Key arriba para analizar imágenes nuevas.");
            }
            data = await analyzeDirectWithGemini(file, apiKey.trim(), sourceLang, targetLang);
          } else {
            try {
              const formData = new FormData();
              formData.append("file", file);
              formData.append("idioma_origen", sourceLang);
              formData.append("idioma_destino", targetLang);
              formData.append("api_key", apiKey);

              const res = await fetch("/api/analyze-upload", {
                method: "POST",
                body: formData
              });
              const resJson = await res.json();
              if (!res.ok) throw new Error(resJson.detail || "Error al analizar la imagen");
              data = resJson;
            } catch (serverErr) {
              if (apiKey.trim()) {
                data = await analyzeDirectWithGemini(file, apiKey.trim(), sourceLang, targetLang);
              } else {
                throw serverErr;
              }
            }
          }

          const newKey = "custom_" + Date.now();
          const newChap = {
            id: newKey,
            title: `Página Importada (${file.name})`,
            flag: "✨",
            langName: `IA (${(data.analysis.source_language || sourceLang).toUpperCase()})`,
            ttsLang: data.analysis.source_language || sourceLang,
            source_language: data.analysis.source_language || sourceLang,
            target_language: data.analysis.target_language || targetLang,
            image_url: data.image_url,
            bubbles: data.analysis.bubbles || []

          setStatusMsg(`Error: ${err.message}`);

          setIsLoading(false);
        }
      };

                    <button
                      onClick={exportToCsvFile}
                      disabled={savedItems.length === 0}
                      className="px-3.5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-200 font-bold text-xs border border-slate-700 transition"
                    >
                      📊 Exportar CSV (Excel)
                    </button>
                  </div>
                </div>

                {/* Instrucciones rápidas de importación en Anki */}
                <div className="bg-indigo-950/40 border border-indigo-500/30 rounded-xl p-3.5 text-xs text-indigo-200 flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <b>💡 ¿Cómo importar en Anki Desktop o AnkiDroid?</b> Haz clic en <b>"Exportar Mazo para Anki (.txt)"</b>, abre Anki → <i>Archivo → Importar</i> y selecciona el archivo descargado. Ya incluye las cabeceras automáticas de Anki (Frente, Reverso, Lectura, Oración del Manga y Etiquetas).
                  </div>
                </div>

                {savedItems.length === 0 ? (
                  <div className="text-center py-12 text-slate-400">
                    <p className="text-base font-bold mb-1">Aún no has guardado palabras ni frases</p>
                    <p className="text-xs">
                      En el Lector, toca una palabra o selecciona varias palabras con el táctil y pulsa "Guardar en Vocabulario / Anki".
                    </p>
                  </div>
                ) : (
                  <div className="grid sm:grid-cols-2 gap-3.5">
                    {savedItems.map((item, idx) => (
                      <div
                        key={item.key || idx}
                        className="bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col justify-between gap-2.5 relative group"
                      >
                        <div className="flex items-start justify-between gap-2">
                          <div>
                            <div className="flex items-center gap-2 mb-1">
                              <span className="text-[11px] px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 font-bold">
                                {item.type}
                              </span>
                              <span className="text-[11px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 font-semibold">
                                → {item.targetLangName}
                              </span>
                            </div>
                            <span className="text-xs font-bold text-rose-400 block">
                              {item.reading}
                            </span>
                            <h3 className="text-xl sm:text-2xl font-black text-white mt-0.5">
                              {item.surface}
                            </h3>
                          </div>

                          <div className="flex items-center gap-1">
                            <button
                              onClick={() => speakText(item.surface, item.sourceLangCode)}
                              className="p-2 rounded-lg bg-slate-800 hover:bg-indigo-600 text-xs"
                              title="Escuchar pronunciación"
                            >
                              🔊
                            </button>
                            <button
                              onClick={() =>
                                setSavedItems(savedItems.filter((x) => x.key !== item.key))
                              }
                              className="p-2 rounded-lg bg-slate-800 hover:bg-rose-600 text-xs text-slate-400 hover:text-white"
                              title="Eliminar tarjeta"
                            >
                              🗑
                            </button>
                          </div>
                        </div>

                        <p className="text-base font-extrabold text-emerald-400">
                          {item.meaning}
                        </p>

                        {item.grammar_note && (
                          <p className="text-xs text-slate-300 bg-slate-900/90 p-2 rounded-lg border border-slate-800">
                            💡 {item.grammar_note}
                          </p>
                        )}

                        {item.sentence && (
                          <div className="pt-2 border-t border-slate-800/80 text-xs text-slate-400">
                            <p className="font-bold text-slate-200">{item.sentence}</p>
                            <p className="text-amber-300/90">{item.sentenceTranslation}</p>
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </main>
          )}

          {/* PESTAÑA DE IMPORTACIÓN (SCRAPER PYTHON + SUBIDA DE IMÁGENES CON GEMINI/OCR) */}
          {activeTab === "import" && (
            <main className="max-w-3xl w-full mx-auto px-4 pt-6 flex-1 space-y-5">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
                <h2 className="text-lg font-bold flex items-center gap-2">
                  ⚡ Motor Híbrido: Gemini Vision + OCR Local + Scraper Python
                </h2>
                <p className="text-xs text-slate-400 leading-relaxed">
                  Conecta tu clave de Gemini para analizar páginas nuevas o usa tu función <code className="text-rose-400">preparar_capitulo_manga()</code> para descargar capítulos desde una URL.
                </p>

                <div className="grid sm:grid-cols-3 gap-3">
                  <div className="sm:col-span-1">
                    <label className="text-xs font-semibold text-slate-300 block mb-1">
                      Idioma del Manga
                    </label>
                    <select
                      value={sourceLang}
                      onChange={(e) => setSourceLang(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm"
                    >
                      <option value="ja">🇯🇵 Japonés</option>
                      <option value="ko">🇰🇷 Coreano</option>
                      <option value="zh">🇨🇳 Chino</option>
                      <option value="en">🇺🇸 Inglés</option>
                      <option value="fr">🇫🇷 Francés</option>
                      <option value="auto">✨ Detectar Automático</option>
                    </select>
                  </div>
                  <div className="sm:col-span-2">
                    <label className="text-xs font-semibold text-slate-300 block mb-1">
                      Gemini API Key (para analizar imágenes nuevas)
                    </label>
                    <input
                      type="password"
                      placeholder="AIzaSy... (Opcional para traducciones, requerido para OCR de imágenes nuevas)"
                      value={apiKey}
                      onChange={(e) => setApiKey(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm"
                    />
                  </div>
                </div>

                {/* Subir imagen */}
                <div className="border-2 border-dashed border-slate-700 rounded-2xl p-5 text-center hover:border-indigo-500 transition">
                  <p className="text-sm font-bold mb-1">
                    1. Subir página de Manga / Manhwa (.jpg, .png, .webp)
                  </p>
                  <p className="text-xs text-slate-400 mb-3">
                    Detectará los globos y separará cada palabra para traducirla al idioma que elijas.
                  </p>
                  <label className="inline-block px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs cursor-pointer">
                    📂 Seleccionar Imagen y Analizar
                    <input
                      type="file"
                      accept="image/*"
                      onChange={handleUploadImage}
                      className="hidden"
                    />
                  </label>
                </div>

                {/* Scraper Python */}
                <form onSubmit={handleRunScraper} className="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-3">
                  <p className="text-sm font-bold">
                    2. Descargar desde URL con <code className="text-emerald-400">preparar_capitulo_manga()</code>
                  </p>
                  <div className="flex gap-2">
                    <input
                      type="url"
                      placeholder="https://sitio-manga.com/capitulo-1"
                      value={scrapeUrl}
                      onChange={(e) => setScrapeUrl(e.target.value)}
                      className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm"
                    />
                    <button
                      type="submit"
                      disabled={isLoading}
                      className="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 disabled:opacity-50 text-white font-bold text-xs"
                    >
                      {isLoading ? "Procesando..." : "Descargar"}
                    </button>
                  </div>
                </form>

                {statusMsg && (
                  <div className="p-3 rounded-xl bg-indigo-950/60 border border-indigo-500/40 text-xs text-indigo-200 font-medium">
                    {statusMsg}
                  </div>
                )}
              </div>
            </main>
          )}

          {/* ====================================================================
              PANEL INFERIOR (BOTTOM SHEET): TRADUCE 1 PALABRA O VARIAS PALABRAS
              SELECCIONADAS CON EL TÁCTIL AL IDIOMA QUE QUIERAS + GUARDAR EN ANKI
             ==================================================================== */}
          {selectedBubble && isBottomSheetOpen && (
            <div className="fixed bottom-0 left-0 right-0 z-50 bg-slate-900/98 backdrop-blur-xl border-t-2 border-rose-500/70 shadow-[0_-18px_45px_rgba(0,0,0,0.85)] bottom-sheet-enter">
              <div className="max-w-6xl mx-auto px-3 sm:px-5 py-3">
                {/* Fila superior del panel: Selección interactiva de palabras de la frase + Selector de idioma */}
                <div className="flex flex-wrap items-center justify-between gap-2 pb-2.5 mb-2.5 border-b border-slate-800">
                  <div className="flex flex-wrap items-center gap-1.5">
                    <span className="text-[10px] font-black uppercase tracking-wider px-2 py-0.5 rounded bg-rose-500/20 text-rose-300 border border-rose-500/30">
                      {isPhraseSelected ? `Frase (${selectedWordsList.length} palabras)` : "Palabra"}
                    </span>

                    {/* Chips de palabras en el panel inferior: permite tocar varias para armar frase */}
                    {(selectedBubble.words || []).map((w, idx) => {
                      const active = selectedWordIndices.includes(idx);
                      return (
                        <button
                          key={idx}
                          onClick={() => {
                            if (multiSelectMode) {
                              setSelectedWordIndices((prev) => {
                                const exists = prev.includes(idx);
                                const next = exists
                                  ? prev.filter((i) => i !== idx)
                                  : [...prev, idx].sort((a, b) => a - b);
                                return next.length > 0 ? next : [idx];
                              });
                            } else {
                              setSelectedWordIndices([idx]);
                            }
                          }}
                          className={`px-2 py-0.5 rounded-lg text-xs sm:text-sm font-bold transition ${
                            active
                              ? "bg-rose-600 text-white shadow ring-2 ring-rose-400"
                              : "bg-slate-800 text-slate-300 hover:bg-slate-700"
                          }`}
                        >
                          {w.surface}
                        </button>
                      );
                    })}

                    <button
                      onClick={() => setMultiSelectMode(!multiSelectMode)}
                      className={`px-2 py-0.5 rounded-lg text-[11px] font-bold border transition ${
                        multiSelectMode
                          ? "bg-fuchsia-600 text-white border-fuchsia-400"
                          : "bg-slate-800 text-fuchsia-300 border-fuchsia-500/40 hover:bg-slate-700"
                      }`}
                      title="Activa para tocar varias palabras y traducirlas juntas"
                    >
                      {multiSelectMode ? "✓ Uniendo palabras" : "+ Unir varias palabras"}
                    </button>

                    <button
                      onClick={() => selectFullBubblePhrase(selectedBubble)}
                      className="px-2 py-0.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-[11px] text-amber-300 font-semibold"
                    >
                      Seleccionar toda la frase
                    </button>
                  </div>

                  {/* Selector de idioma directo en el panel inferior */}
                  <div className="flex items-center gap-2">
                    <span className="text-[11px] text-slate-400 font-semibold">Idioma:</span>
                    <select
                      value={targetLang}
                      onChange={(e) => setTargetLang(e.target.value)}
                      className="bg-slate-950 text-white font-bold text-xs rounded-lg px-2 py-1 border border-indigo-500/50"
                    >
                      {TARGET_LANGUAGES.map((lang) => (
                        <option key={lang.code} value={lang.code}>
                          {lang.flag} {lang.name}
                        </option>
                      ))}
                    </select>
                    <button
                      onClick={() => setIsBottomSheetOpen(false)}
                      className="text-slate-400 hover:text-white text-xs font-bold px-2 py-1 rounded-lg bg-slate-800"
                    >
                      ✕
                    </button>
                  </div>
                </div>

                {/* Cuerpo del Panel Inferior: Muestra 1 palabra o la Frase de varias palabras seleccionada */}
                {selectedWordsList.length > 0 && (
                  <div className="grid grid-cols-1 md:grid-cols-12 gap-3 items-center">
                    {/* Palabra o Frase Seleccionada + Lectura + Audio */}
                    <div className="md:col-span-4 flex items-center gap-3 bg-slate-950/90 border border-slate-800 p-3 rounded-xl">
                      <button
                        onClick={() => speakText(selectedSurfaceText, currentChapter.ttsLang)}
                        className="w-11 h-11 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center text-lg shadow shrink-0"
                        title="Escuchar selección"
                      >
                        🔊
                      </button>
                      <div className="min-w-0 flex-1">
                        <div className="text-xs font-bold text-rose-400 truncate">
                          {selectedReadingText}
                        </div>
                        <div className="text-xl sm:text-2xl font-black text-white tracking-tight break-words">
                          {selectedSurfaceText}
                        </div>
                      </div>
                    </div>

                    {/* Traducción al idioma elegido + Desglose */}
                    <div className="md:col-span-5 bg-slate-950/90 border border-slate-800 p-3 rounded-xl flex flex-col justify-center">
                      <div className="flex flex-wrap items-center gap-2 mb-1">
                        <span className="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                          {targetLangInfo.flag} {targetLangInfo.name}
                        </span>
                        <span className="text-base sm:text-lg font-black text-emerald-400">
                          {isTranslating ? "Traduciendo..." : dynamicWordTranslation}
                        </span>
                      </div>

                      {isPhraseSelected ? (
                        <div className="text-[11px] text-slate-300 mt-0.5 flex flex-wrap gap-1.5">
                          {selectedWordsList.map((w, i) => (
                            <span key={i} className="px-1.5 py-0.5 rounded bg-slate-900 border border-slate-800">
                              <b className="text-white">{w.surface}</b>: {w.meaning}
                            </span>
                          ))}
                        </div>
                      ) : (
                        singleSelectedWord?.grammar_note && (
                          <p className="text-xs text-slate-300 mt-0.5 leading-snug">
                            💡 {singleSelectedWord.grammar_note}
                          </p>
                        )
                      )}

                      <p className="text-[11px] text-amber-300/90 mt-1 pt-1 border-t border-slate-800/80 truncate">
                        Globo completo: “{dynamicBubbleTranslation || selectedBubble.translated_text}”
                      </p>
                    </div>

                    {/* Acciones: Guardar Traducción y Exportar Anki */}
                    <div className="md:col-span-3 flex flex-col gap-1.5">
                      <button
                        onClick={handleSaveCurrentSelection}
                        className={`w-full py-2.5 px-3 rounded-xl font-extrabold text-xs transition flex items-center justify-center gap-1.5 shadow ${
                          isCurrentSelectionSaved()
                            ? "bg-amber-500 text-slate-950"
                            : "bg-rose-600 hover:bg-rose-500 text-white"
                        }`}
                      >
                        {isCurrentSelectionSaved()
                          ? "★ Guardada en Vocabulario / Anki"
                          : `☆ Guardar ${isPhraseSelected ? "Frase" : "Palabra"} para Anki`}
                      </button>

                      {savedItems.length > 0 && (
                        <button
                          onClick={exportToAnkiFile}
                          className="w-full py-1.5 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-300 font-bold text-[11px] border border-amber-500/30 transition"
                        >
                          📥 Exportar {savedItems.length} a Anki (.txt)
                        </button>
                      )}
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
